

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050816">
    <title>Admin Login | Shaddrack Online Gallery</title>

    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login-neon.css">
<link rel="stylesheet" href="login-effects.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Animated background -->
    <div class="background">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="glow glow-three"></div>
        <div id="particles"></div>
    </div>

    <!-- Helicopter and suspended login banner -->
    <div class="flight-scene">

        <div class="helicopter-area">
            <div class="helicopter">🚁</div>
            <div class="helicopter-label">SHADDRACK AIR SERVICES</div>
        </div>

        <div class="banner-rope"></div>

        <main class="main-container">
            <div class="login-card">

                <div class="logo">
                    <div class="logo-icon">
                        <i class="fa-solid fa-images"></i>
                    </div>

                    <h1>SHADDRACK <span class="highlight">GALLERY</span></h1>
                    <p>Administrator Control Center</p>
                </div>

                <!-- LOGIN SECTION -->
                <section id="loginSection" class="form-section active">

                    <div class="welcome-text">
                        <h2>Welcome Back</h2>
                        <p>Sign in to manage your gallery</p>
                    </div>

                    <form id="loginForm">

                        <div class="input-group">
                            <label for="email">Email Address</label>

                            <div class="input-wrapper">
                                <i class="fa-solid fa-envelope"></i>

                                <input
                                    type="email"
                                    id="email"
                                    placeholder="Enter your email"
                                    autocomplete="username"
                                    required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="password">Password</label>

                            <div class="input-wrapper">
                                <i class="fa-solid fa-lock"></i>

                                <input
                                    type="password"
                                    id="password"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required>

                                <button
                                    type="button"
                                    id="togglePassword"
                                    class="password-toggle"
                                    aria-label="Show password">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="forgot-row">
                            <button type="button" id="forgotPassword">
                                Forgot password?
                            </button>
                        </div>

                        <button type="submit" id="loginButton" class="login-button">
                            <span>LOGIN TO DASHBOARD</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>

                        <p id="loginMessage" class="message" aria-live="polite"></p>

                    </form>
                </section>

                <!-- PASSWORD RESET SECTION -->
                <section id="resetSection" class="form-section">

                    <div class="welcome-text">
                        <h2>Reset Password</h2>
                        <p>Enter your new administrator password</p>
                    </div>

                    <form id="resetForm">

                        <div class="input-group">
                            <label for="newPassword">New Password</label>

                            <div class="input-wrapper">
                                <i class="fa-solid fa-lock"></i>

                                <input
                                    type="password"
                                    id="newPassword"
                                    placeholder="Enter new password"
                                    autocomplete="new-password"
                                    minlength="6"
                                    required>
                            </div>
                        </div>

                        <button type="submit" class="login-button" id="resetButton">
                            <span>UPDATE PASSWORD</span>
                            <i class="fa-solid fa-key"></i>
                        </button>

                        <p id="resetMessage" class="message" aria-live="polite"></p>

                        <button type="button" id="backToLogin" class="back-button">
                            <i class="fa-solid fa-arrow-left"></i>
                            Back to Login
                        </button>

                    </form>
                </section>

                <div class="card-footer">
                    <i class="fa-solid fa-shield-halved"></i>
                    Secure Administrator Access
                </div>

            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script src="login-effects.js"></script>

</body>
</html>
